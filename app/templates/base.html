    <style>

#preloader {
    position: fixed;
    inset: 0;
    background-color: #fff;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.5s ease;
  }

  #preloader.fade-out {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity 0.5s ease, visibility 0.5s ease;
}


  /* Spinner */
  #preloader .spinner {
    border-top: 4px solid #2563eb; /* Blue-600 */
    border-right: 4px solid transparent;
    border-radius: 50%;
    width: 48px;
    height: 48px;
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    0% { transform: rotate(0); }
    100% { transform: rotate(360deg); }
  }


        
#cartBadge {
  font-size: 0.9rem;
  color: white;
  background-color: #f44336;
  padding: 0.3rem 0.6rem;
  border-radius: 50%;
  top: -0.5rem;
  right: -0.5rem;
  transform: translate(50%, -50%);
  display: none; /* Initially hide badge if cart is empty */
}

/* Cart Icon Animation (on add to cart) */
.cart-icon.pulse {
  animation: pulse-animation 0.5s ease-in-out;
}

@keyframes pulse-animation {
  0% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.2);
  }
  100% {
    transform: scale(1);
  }
}

/* Toast Notification Styling */
.toast-message {
    position: fixed;
    bottom: 3rem;
    right: 2rem;
    background: #28a745;
    color: white;
    padding: 0.75rem 1.5rem;
    border-radius: 1rem;
    opacity: 0;
    transform: translateY(20px);
    transition: all 0.4s ease;
    z-index: 9999;
    font-weight: bold;
}

.toast-message.show {
    opacity: 1;
    transform: translateY(0);
}
    </style>
</head>
<body class="d-flex flex-column min-vh-100">
  <div id="preloader" class="fixed inset-0 z-[9999] flex flex-col items-center justify-center bg-white dark:bg-gray-900 text-gray-800 dark:text-white transition-opacity duration-700">
  <div class="animate-spin rounded-full h-14 w-14 border-[3px] border-blue-500 border-t-transparent mb-4"></div>
  <p class="text-base font-medium tracking-wide">Loading Salesta...</p>
</div>



    {% include 'partials/navbar.html' %}

    <!-- Main Content -->
<main class="container-fluid flex-grow-1 pt-4 mt-5">
    <div class="row">
        <div class="col-12">
            {% block content %}{% endblock %}
        </div>
    </div>

    <!-- Tailwind Toast Container -->
    <div id="toastContainer" class="fixed top-4 right-4 z-50 space-y-4">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <script>
                    document.addEventListener('DOMContentLoaded', function () {
                        {% for category, message in messages %}
                            showToast({{ message|tojson }}, '{{ category }}');
                        {% endfor %}
                    });
                </script>
            {% endif %}
        {% endwith %}
    </div>

    <script>
        function showToast(message, type = 'success') {
            const toastContainer = document.getElementById('toastContainer');
            if (!toastContainer) return;

            const toastId = `toast-${Date.now()}`;
            const config = {
                success: {
                    bg: 'bg-green-900/80',
                    border: 'border-green-700',
                    icon: '✅',
                    bar: 'bg-green-500'
                },
                error: {
                    bg: 'bg-red-900/80',
                    border: 'border-red-700',
                    icon: '❌',
                    bar: 'bg-red-500'
                },
                warning: {
                    bg: 'bg-yellow-900/80',
                    border: 'border-yellow-700',
                    icon: '⚠️',
                    bar: 'bg-yellow-500'
                },
                info: {
                    bg: 'bg-blue-900/80',
                    border: 'border-blue-700',
                    icon: 'ℹ️',
                    bar: 'bg-blue-500'
                }
            };

            const cfg = config[type] || config.success;

            const toast = document.createElement('div');
            toast.id = toastId;
            toast.className = `relative flex items-start max-w-sm w-full p-4 rounded-lg shadow-lg text-white border ${cfg.bg} ${cfg.border} animate-fade-in`;
            toast.setAttribute('role', 'alert');
            toast.innerHTML = `
                <div class="text-xl mr-3">${cfg.icon}</div>
                <div class="flex-1 text-sm">${message}</div>
                <button onclick="document.getElementById('${toastId}').remove()" class="ml-4 text-white hover:text-gray-300">&times;</button>
                <div class="absolute bottom-0 left-0 h-1 w-full ${cfg.bar} animate-progress"></div>
            `;

            toastContainer.appendChild(toast);

            // Auto-hide after 5 seconds
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-6');
                setTimeout(() => toast.remove(), 300);
            }, 5000);
        }
    </script>

    <style>
        @keyframes progress {
            0% { width: 100%; }
            100% { width: 0%; }
        }
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-progress {
            animation: progress 5s linear forwards;
        }
        .animate-fade-in {
            animation: fade-in 0.3s ease-out;
        }
    </style>
</main>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // Enhanced Mobile Menu Handling
    const navbar = document.querySelector('.navbar');
    const navbarCollapse = document.querySelector('.navbar-collapse');
    
    // Close menu when clicking outside on mobile
    document.addEventListener('click', (e) => {
        if (!e.target.closest('.navbar') && navbarCollapse.classList.contains('show')) {
            bootstrap.Collapse.getInstance(navbarCollapse).hide();
        }
    });

    // Dynamic Navbar Scroll Effect
    const updateNavbar = () => {
        navbar.classList.toggle('scrolled', window.scrollY > 50);
        navbar.classList.toggle('shadow-sm', window.scrollY > 50);
    };
    
    window.addEventListener('scroll', updateNavbar);
    updateNavbar(); // Initial check

    // Add aria-expanded state for accessibility
    navbarCollapse.addEventListener('show.bs.collapse', () => {
        navbar.querySelector('[aria-expanded]').setAttribute('aria-expanded', 'true');
    });
    
    navbarCollapse.addEventListener('hide.bs.collapse', () => {
        navbar.querySelector('[aria-expanded]').setAttribute('aria-expanded', 'false');
    });
});
</script>

<!-- Cookie Consent -->
<script src="https://cdn.jsdelivr.net/npm/cookieconsent@3/build/cookieconsent.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cookieconsent@3/build/cookieconsent.min.css" />

<script>
document.addEventListener('DOMContentLoaded', function() {
    if(typeof cookieconsent === 'undefined') return;
    
    window.cookieconsent.initialise({
        palette: {
            popup: { 
                background: '#1a1a1a',
                text: '#ffffff'
            },
            button: { 
                background: '#10b981', // Emerald-500
                text: '#ffffff'
            }
        },
        theme: 'classic',
        content: {
            message: 'We use cookies to enhance your browsing experience and analyze site traffic.',
            dismiss: 'Accept',
            link: 'Learn more',
            href: '{{ url_for("main.privacy_policy") }}'
        },
        cookie: {
            name: 'Salesta_consent',
            domain: window.location.hostname,
            path: '/',
            expires: 365
        }
    });
});
</script>
<script>
  window.addEventListener('load', () => {
    const preloader = document.getElementById('preloader');
    const html = document.documentElement;
    if (preloader) {
      preloader.classList.add('fade-out');
      html.style.overflow = ''; // Re-enable scroll
      setTimeout(() => preloader.remove(), 500);
    }
  });
</script>
