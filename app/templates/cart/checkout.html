{% extends 'base.html' %}
{% block content %}


 <!-- Tailwind CSS v3 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Alpine.js for lightweight reactivity -->
  <script src="https://unpkg.com/alpinejs@3.x.x" defer></script>
  <!-- Font Awesome for icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>

<div class="min-h-screen bg-gray-50 py-8 px-4 sm:px-6 lg:px-8 mt-3">
  <div class="max-w-7xl mx-auto">
    <div class="lg:grid lg:grid-cols-3 lg:gap-8">
      <!-- Shipping Details -->
      <div class="lg:col-span-2">
        <div class="bg-white rounded-xl shadow-lg p-6 mb-8 lg:mb-0">
          <div class="mb-8">
            <h2 class="text-3xl font-bold text-gray-900 mb-2">Shipping Details</h2>
            <p class="text-gray-500">Please provide your delivery information</p>
          </div>

          <form id="checkout-form" class="space-y-6">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <!-- Name Input -->
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Full Name</label>
              <div class="relative">
                <input
                  id="name"
                  name="name"
                  required
                  class="w-full pl-11 pr-4 py-3 rounded-lg border border-gray-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-200"
                  placeholder="John Doe"
                  pattern="[A-Za-z ]{3,50}"
                >
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center">
                  <i class="fas fa-user text-gray-400"></i>
                </div>
              </div>
              <p class="mt-1 text-sm text-red-600 validation-message hidden"></p>
            </div>

            <!-- Address Input -->
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Shipping Address</label>
              <div class="relative">
                <textarea
                  id="address"
                  name="address"
                  required
                  class="w-full pl-11 pr-4 py-3 rounded-lg border border-gray-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 h-32"
                  placeholder="123 Main Street, Nairobi"
                ></textarea>
                <div class="absolute inset-y-0 left-0 pl-3 pt-3">
                  <i class="fas fa-map-marker-alt text-gray-400"></i>
                </div>
              </div>
              <p class="mt-1 text-sm text-red-600 validation-message hidden"></p>
            </div>

            <!-- Grid Group -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <!-- Zip Code -->
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Zip Code</label>
                <div class="relative">
                  <input
                    id="zip"
                    name="zip" 
                    type="text"
                    required
                    class="w-full pl-11 pr-4 py-3 rounded-lg border border-gray-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-200"
                    placeholder="000000"
                    pattern="\d{5,6}"
                  >
                  <div class="absolute inset-y-0 left-0 pl-3 flex items-center">
                    <i class="fas fa-map-pin text-gray-400"></i>
                  </div>
                </div>
                <p class="mt-1 text-sm text-red-600 validation-message hidden"></p>
              </div>

              <!-- Phone Number -->
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Phone Number</label>
                <div class="relative">
                  <input
                    id="phone"
                    name="phone"
                    required
                    class="w-full pl-11 pr-4 py-3 rounded-lg border border-gray-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-200"
                    placeholder="+2547XX XXX XXX"
                    pattern="^\+254\d{9}$"
                  >
                  <div class="absolute inset-y-0 left-0 pl-3 flex items-center">
                    <i class="fas fa-phone text-gray-400"></i>
                  </div>
                </div>
                <p class="mt-1 text-sm text-red-600 validation-message hidden"></p>
              </div>
            </div>

            <!-- Submit Button -->
            <button
              type="submit"
              class="w-full bg-blue-600 hover:bg-blue-700 text-white py-4 px-6 rounded-lg font-semibold text-lg transition-colors relative"
            >
              <span class="flex items-center justify-center gap-2">
                Proceed to Payment
                <i class="fas fa-arrow-right"></i>
              </span>
              <div class="absolute inset-0 bg-blue-700 hidden items-center justify-center loading-spinner">
                <div class="animate-spin rounded-full h-6 w-6 border-4 border-white border-t-transparent"></div>
              </div>
            </button>
          </form>

          <!-- Security Badge -->
          <div class="mt-6 pt-6 border-t border-gray-200 flex items-center justify-center gap-2 text-sm text-gray-500">
            <i class="fas fa-lock text-blue-500"></i>
            <span>256-bit SSL Secured Checkout</span>
          </div>
        </div>
      </div>

      <!-- Order Summary -->
      <div class="mt-8 lg:mt-0">
        <div class="bg-white rounded-xl shadow-lg p-6">
          <h2 class="text-3xl font-bold text-gray-900 mb-6">Order Summary</h2>
          
          <!-- Skeleton Loader -->
          <div id="order-summary" class="space-y-4 mb-6 ">
            <div class="h-20 bg-gray-100 rounded-lg"></div>
            <div class="h-20 bg-gray-100 rounded-lg"></div>
          </div>

          <!-- Total Price -->
          <div class="border-t border-gray-200 pt-4">
            <div class="flex justify-between items-center">
              <span class="text-lg font-semibold text-gray-700">Total:</span>
              <span class="text-2xl font-bold text-blue-600">$<span id="order-total">0.00</span></span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Toast Container -->
<div id="toastContainer" class="fixed top-4 right-4 space-y-2 z-50"></div>

<script src="{{ url_for('static', filename='js/checkout.js') }}"></script>

<style>
  .loading-spinner {
    transition: opacity 0.3s ease;
  }

  button:disabled {
    opacity: 0.7;
    cursor: not-allowed;
  }

  button:disabled .loading-spinner {
    display: flex;
  }
</style>
{% endblock %}
