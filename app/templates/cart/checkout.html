{% extends 'base.html' %}
{% block content %}
<div class="container mx-auto px-4 py-8 max-w-7xl">
  <div class="flex flex-col lg:flex-row lg:space-x-8">

    <!-- Shipping Details (left) -->
    <section class="glass-card p-6 rounded-xl shadow-2xl w-full lg:w-2/3 mb-8 lg:mb-0">
      <h2 class="text-3xl font-bold mb-6 text-gradient-primary">Shipping Details</h2>
      <form id="checkout-form" class="space-y-6">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
          <label class="form-label" for="name">Full Name</label>
          <div class="input-wrapper">
            <i class="fas fa-user input-icon"></i>
            <input id="name" name="name" required class="form-input" placeholder="John Doe" pattern="[A-Za-z ]{3,50}">
          </div>
          <div class="validation-message"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="address">Shipping Address</label>
          <div class="input-wrapper">
            <i class="fas fa-map-marker-alt input-icon"></i>
            <textarea id="address" name="address" required class="form-input h-24" placeholder="123 Main Street, Nairobi"></textarea>
          </div>
          <div class="validation-message"></div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="form-group">
            <label class="form-label" for="zip">Zip Code</label>
            <div class="input-wrapper">
              <i class="fas fa-map-marker-alt input-icon"></i>
              <input id="zip" name="zip" type="text" required class="form-input"
                     placeholder="000000" pattern="\d{5,6}" title="5- or 6-digit zip code">
            </div>
            <div class="validation-message"></div>
          </div>

          <div class="form-group">
            <label class="form-label" for="phone">Phone Number</label>
            <div class="input-wrapper">
              <i class="fas fa-phone input-icon"></i>
              <input id="phone" name="phone" required class="form-input"
                     placeholder="+2547XX XXX XXX" pattern="^\+254\d{9}$">
            </div>
            <div class="validation-message"></div>
          </div>
        </div>

        <button type="submit"
                class="btn-gradient-primary w-full py-3 rounded-lg hover-lift flex justify-center items-center gap-2 relative overflow-hidden">
          <span class="button-content">Proceed to Payment <i class="fas fa-arrow-right ml-2"></i></span>
          <div class="loading-spinner hidden"></div>
        </button>
      </form>


      <!-- in your template, after the form -->
<script>
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('checkout-form')
      .addEventListener('submit', e => {
        console.log('🚀 Minimal intercept');
        e.preventDefault();
      });
  });
</script>


      <div class="mt-6 p-4 bg-opacity-10 rounded-lg flex items-center space-x-3 text-sm">
        <i class="fas fa-lock text-primary"></i>
        <span class="opacity-75">256-bit SSL secured checkout</span>
      </div>
    </section>

    <!-- Order Summary (right) -->
    <aside class="glass-card p-6 rounded-xl shadow-2xl w-full lg:w-1/3">
      <h2 class="text-3xl font-bold mb-6 text-gradient-primary">Order Summary</h2>
      <div id="order-summary" class="space-y-4 mb-6">
        <div class="skeleton-loader h-20"></div>
        <div class="skeleton-loader h-20"></div>
      </div>
      <div class="border-t border-opacity-10 pt-4">
        <div class="flex justify-between items-center text-lg font-semibold">
          <span>Total:</span>
          <span class="text-2xl text-primary">$<span id="order-total">0.00</span></span>
        </div>
      </div>
    </aside>
  </div>
</div>

<!-- Toast container -->
<div id="toastContainer" class="fixed top-4 right-4 space-y-2 z-50"></div>

<script src="{{ url_for('static', filename='js/checkout.js') }}"></script>
{% endblock %}
