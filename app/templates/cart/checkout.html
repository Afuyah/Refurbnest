{% extends 'base.html' %}

{% block head %}
  {{ super() }}
  <!-- CSRF token for AJAX -->
  <meta name="csrf-token" content="{{ csrf_token() }}">
{% endblock %}

{% block content %}
<div class="container mx-auto p-8 grid grid-cols-1 md:grid-cols-2 gap-8">

  <!-- Left: Shipping Information -->
  <div class="bg-white p-6 rounded shadow">
    <h2 class="text-2xl font-bold mb-4">Shipping Information</h2>
    <form id="checkout-form" class="space-y-4">
      <div>
        <label for="name" class="block mb-1 font-semibold">Full Name</label>
        <input id="name" name="name" required class="w-full p-2 border rounded" placeholder="John Doe" />
      </div>
      <div>
        <label for="address" class="block mb-1 font-semibold">Address</label>
        <textarea id="address" name="address" required class="w-full p-2 border rounded" placeholder="123 Main St, City, Country"></textarea>
      </div>
      <div>
        <label for="phone" class="block mb-1 font-semibold">Phone Number</label>
        <input id="phone" name="phone" required class="w-full p-2 border rounded" placeholder="+2547XXXXXXXX" />
      </div>
      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded">
        Proceed to Payment
      </button>
    </form>
  </div>

  <!-- Right: Order Summary -->
  <div class="bg-gray-50 p-6 rounded shadow">
    <h2 class="text-2xl font-bold mb-4">Your Order</h2>
    <div id="order-summary" class="space-y-4">
      <!-- JavaScript will populate items here -->
      <p>Loading your cart...</p>
    </div>
    <div class="border-t pt-4 mt-4 text-lg font-semibold">
      Total: $<span id="order-total">0.00</span>
    </div>
  </div>

</div>
{% endblock %}

{% block scripts %}
  {{ super() }}
  <script src="{{ url_for('static', filename='js/checkout.js') }}"></script>
{% endblock %}
