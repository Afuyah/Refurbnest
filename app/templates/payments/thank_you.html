<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Thank You for Your Order!</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f9f9f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .thank-you-container {
            background: white;
            padding: 2rem 3rem;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
        }
        h1 {
            color: #2c7be5;
        }
        p {
            font-size: 1.1rem;
            margin-top: 1rem;
        }
        a {
            display: inline-block;
            margin-top: 2rem;
            padding: 0.6rem 1.5rem;
            background-color: #2c7be5;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: 600;
            transition: background-color 0.3s ease;
        }
        a:hover {
            background-color: #1a5edb;
        }
    </style>
</head>
<body>
    <div class="thank-you-container">
        <h1>Thank You!</h1>
        <p>Your order #<strong>{{ order_id }}</strong> has been received successfully.</p>
        <p>We appreciate your purchase and will process your order soon.</p>
        <a href="{{ url_for('main.home') }}">Return to Home</a>
    </div>
</body>
</html>
