<link rel="stylesheet" href="https://unpkg.com/swiper@8/swiper-bundle.min.css">

<div class="lg:flex lg:gap-8 min-h-screen bg-gradient-to-b from-gray-900 to-gray-800">
  <!-- Brand Sidebar Container -->
  <div class="lg:w-64 lg:flex-shrink-0">
    <!-- Mobile Toggle Button -->
    <div class="lg:hidden text-right mb-2 p-2">
      <button id="toggleBrandSidebar" class="px-4 py-2 text-sm border border-gray-600 rounded-lg hover:border-emerald-400 hover:text-emerald-300 transition-colors">
        <i class="fas fa-filter mr-2"></i>
        Filter Brands
      </button>
    </div>

  <!-- Brand Sidebar -->
   <aside id="brandSidebar" class="fixed lg:sticky lg:top-[1rem] h-screen lg:h-auto lg:overflow-y-auto inset-y-0 left-0 w-64 z-50 bg-gray-800/90 lg:bg-transparent backdrop-blur-lg lg:backdrop-blur-none transform -translate-x-full lg:translate-x-0 transition-transform duration-300">
      <div class="p-6 lg:p-0 lg:pr-4 border-r border-gray-700 lg:border-none">
      <div class="mb-6">
        <h4 class="text-xl font-bold bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent">
          Browse Brands
        </h4>
        <p class="text-gray-400 mt-1 text-sm">Filter by manufacturer</p>
      </div>

      <div class="space-y-2">
        <!-- All Brands -->
        <a href="{{ url_for('main.list_products', category=selected_category.id if selected_category else None) }}"
           class="flex items-center px-4 py-3 rounded-lg transition-colors {% if not selected_brand_id %}bg-gray-700 border border-emerald-400/30{% else %}hover:bg-gray-700/50{% endif %}">
          <i class="fas fa-globe mr-3 text-gray-400"></i>
          <span class="text-gray-300">All Brands</span>
        </a>

        <!-- Dynamic Brand Items -->
        {% for brand in brands %}
        <a href="{{ url_for('main.list_products', brand=brand.id, category=selected_category.id if selected_category else None) }}"
           class="flex items-center px-4 py-3 rounded-lg transition-colors {% if brand.id|string == selected_brand_id %}bg-gray-700 border border-emerald-400/30{% else %}hover:bg-gray-700/50{% endif %}">
          {% if brand.logo %}
          <img src="{{ url_for('brand_logo', filename=brand.logo) }}" 
               alt="{{ brand.name }} logo"
               class="w-8 h-8 mr-3 object-contain">
          {% endif %}
          <span class="text-gray-300">{{ brand.name }}</span>
        </a>
        {% endfor %}
      </div>
    </div>
  </aside>
</div>

<script>
  const toggleBtn = document.getElementById('toggleBrandSidebar');
  const sidebar = document.getElementById('brandSidebar');

  toggleBtn.addEventListener('click', () => {
    const isOpen = sidebar.classList.contains('translate-x-0');

    sidebar.classList.toggle('translate-x-0');
    sidebar.classList.toggle('-translate-x-full');

    // Update button text and icon
    toggleBtn.innerHTML = isOpen
      ? `<i class="fas fa-filter mr-2"></i> Filter Brands`
      : `<i class="fas fa-times mr-2"></i> Close`;
  });
</script>
